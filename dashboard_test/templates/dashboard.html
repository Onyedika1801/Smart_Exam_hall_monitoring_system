<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exam Hall Monitor — Dashboard (Test)</title>
    <style>
        body {
            background: #14161a;
            color: #e6e6e6;
            font-family: -apple-system, Segoe UI, Roboto, sans-serif;
            margin: 0;
            padding: 24px;
        }
        h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
        }
        p.subtitle {
            color: #9a9a9a;
            font-size: 14px;
            margin-top: 0;
            margin-bottom: 24px;
        }
        .glance-bar {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 20px 0 28px;
        }
        .glance-card {
            background: #1a1c21;
            border-radius: 10px;
            padding: 14px 16px;
        }
        .glance-label {
            font-size: 12px;
            color: #9a9a9a;
            margin: 0 0 6px;
        }
        .glance-value {
            font-size: 26px;
            font-weight: 700;
            margin: 0;
        }
        .glance-value.red { color: #e5484d; }
        .glance-value.yellow { color: #e5c73d; }
        .main-split {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            align-items: stretch;
        }
        @media (max-width: 480px) {
            .main-split {
                grid-template-columns: 1fr;
            }
        }
        .split-panel {
            background: #1a1c21;
            border-radius: 12px;
            padding: 14px;
            box-sizing: border-box;
        }
        .video-container {
            border-radius: 8px;
            overflow: hidden;
            background: #000;
        }
        .video-container img {
            display: block;
            width: 100%;
            height: auto;
        }
        .status {
            margin-top: 10px;
            font-size: 13px;
            color: #6bd47a;
        }
        h2 {
            font-size: 15px;
            font-weight: 600;
            margin-top: 28px;
            margin-bottom: 10px;
            color: #cfcfcf;
        }
        .seat-map {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            max-width: 320px;
        }
        .seat {
            aspect-ratio: 1;
            background: #2a2d33;
            border-radius: 4px;
            transition: background 0.3s ease;
        }
        .seat.flash {
            box-shadow: 0 0 0 2px #fff3;
        }
        .score-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .score-label {
            width: 60px;
            color: #b0b0b0;
        }
        .score-track {
            flex: 1;
            height: 10px;
            background: #2a2d33;
            border-radius: 5px;
            overflow: hidden;
        }
        .score-fill {
            height: 100%;
            width: 0%;
            background: #3d3f45;
            transition: width 0.3s ease, background 0.3s ease;
        }
        .score-value {
            width: 28px;
            text-align: right;
            color: #d0d0d0;
        }
        .alert-log-scroll {
            max-height: 480px;
            overflow-y: auto;
            border-radius: 8px;
            background: #17191d;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        th, td {
            text-align: left;
            padding: 6px 8px;
            border-bottom: 1px solid #23262b;
        }
        th {
            color: #8a8a8a;
            font-weight: 500;
            background: #17191d;
            position: sticky;
            top: 0;
            z-index: 1;
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }
        .modal-overlay.hidden {
            display: none;
        }
        .modal-box {
            background: #1c1e23;
            border: 1px solid #e5484d;
            border-radius: 10px;
            padding: 28px 32px;
            min-width: 300px;
            text-align: center;
            box-shadow: 0 0 40px rgba(229,72,77,0.35);
        }
        .modal-box.level-yellow {
            border: 1px solid #e5c73d;
            box-shadow: 0 0 40px rgba(229,199,61,0.3);
        }
        .modal-title {
            font-size: 20px;
            font-weight: 700;
            color: #e5484d;
            margin-bottom: 14px;
            letter-spacing: 0.5px;
        }
        .modal-title.level-yellow {
            color: #e5c73d;
        }
        .modal-candidate {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 6px;
        }
        .modal-detail {
            font-size: 14px;
            color: #b0b0b0;
            margin-bottom: 20px;
        }
        .modal-dismiss {
            background: #e5484d;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .modal-dismiss:hover {
            background: #c73e42;
        }
        .modal-dismiss.level-yellow {
            background: #e5c73d;
            color: #14161a;
        }
        .modal-dismiss.level-yellow:hover {
            background: #cbad2e;
        }
        .snapshot-box {
            background: #1c1e23;
            border: 1px solid #3d3f45;
            border-radius: 10px;
            padding: 20px;
            max-width: min(90vw, 640px);
            text-align: center;
        }
        .snapshot-caption {
            font-size: 13px;
            color: #b0b0b0;
            margin-bottom: 12px;
        }
        .snapshot-img {
            width: 100%;
            height: auto;
            border-radius: 6px;
            display: block;
            margin-bottom: 16px;
        }
        #alert-log tbody tr.has-snapshot {
            cursor: pointer;
        }
        #alert-log tbody tr.has-snapshot:hover {
            background: #1e2126;
        }
        .snapshot-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            border-radius: 6px;
            background: rgba(90, 160, 255, 0.18);
            color: #7db3ff;
            font-size: 14px;
        }
        #alert-log tbody tr.session-divider td {
            padding: 10px 8px 4px 8px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #6a6d73;
            text-transform: uppercase;
            border-bottom: 1px solid #23262b;
            border-top: 1px solid #23262b;
            cursor: default;
            background: #17191d;
        }
        .toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 998;
        }
        .toast {
            background: #1c1e23;
            border-left: 4px solid #e5c73d;
            border-radius: 6px;
            padding: 12px 16px;
            min-width: 240px;
            max-width: 300px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.4);
            animation: toast-in 0.25s ease-out;
        }
        .toast.toast-out {
            animation: toast-out 0.25s ease-in forwards;
        }
        @keyframes toast-in {
            from { transform: translateX(30px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes toast-out {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(30px); opacity: 0; }
        }
        .toast-title {
            font-size: 12px;
            font-weight: 700;
            color: #e5c73d;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .toast-body {
            font-size: 13px;
            color: #d0d0d0;
        }
    </style>
</head>
<body>
    <div id="toast-container" class="toast-container"></div>

    <h1>Exam Hall Monitor</h1>
    <p class="subtitle">Live feed + real detection pipeline (alert log, score bar, seat map)</p>

    <div class="glance-bar">
        <div class="glance-card">
            <p class="glance-label">Red alerts</p>
            <p class="glance-value red" id="glance-red">0</p>
        </div>
        <div class="glance-card">
            <p class="glance-label">Yellow alerts</p>
            <p class="glance-value yellow" id="glance-yellow">0</p>
        </div>
        <div class="glance-card">
            <p class="glance-label">Candidates tracked</p>
            <p class="glance-value" id="glance-total">0</p>
        </div>
    </div>

    <div class="main-split">
        <div class="split-panel">
            <h2 style="margin-top: 0;">Seat Map</h2>
            <div id="seat-map" class="seat-map"></div>
        </div>
        <div class="split-panel">
            <h2 style="margin-top: 0;">Camera Feed</h2>
            <div class="video-container">
                <img src="{{ url_for('video_feed') }}" alt="Live camera feed">
            </div>
            <p class="status">● Live feed active</p>
        </div>
    </div>

    <h2>Candidate Scores</h2>
    <div id="score-bars"></div>

    <h2>Alert Log</h2>
    <div class="alert-log-scroll">
        <table id="alert-log">
            <thead>
                <tr><th>Time</th><th>Candidate</th><th>Behaviour</th><th>Score</th><th>Camera</th><th></th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div id="alert-modal" class="modal-overlay hidden">
        <div id="modal-box" class="modal-box">
            <div id="modal-title" class="modal-title">🔴 RED ALERT</div>
            <div class="modal-body">
                <div id="modal-candidate" class="modal-candidate"></div>
                <div id="modal-detail" class="modal-detail"></div>
            </div>
            <button id="modal-dismiss" class="modal-dismiss">Acknowledge</button>
        </div>
    </div>

    <div id="snapshot-modal" class="modal-overlay hidden">
        <div class="snapshot-box">
            <div id="snapshot-caption" class="snapshot-caption"></div>
            <img id="snapshot-img" class="snapshot-img" src="" alt="Detection snapshot">
            <button id="snapshot-dismiss" class="modal-dismiss">Close</button>
        </div>
    </div>

    <script>
        const GRID_COLS = 5;
        const GRID_ROWS = 4;

        // Build the seat map grid once on load
        const seatMap = document.getElementById("seat-map");
        for (let r = 1; r <= GRID_ROWS; r++) {
            for (let c = 1; c <= GRID_COLS; c++) {
                const cell = document.createElement("div");
                cell.className = "seat";
                cell.id = `seat-R${r}C${c}`;
                cell.textContent = "";  // no coordinates shown, per spec
                seatMap.appendChild(cell);
            }
        }

        const scoreBars = {};  // candidate_id -> DOM element

        function ensureScoreBar(candidateId) {
            if (scoreBars[candidateId]) return scoreBars[candidateId];

            const wrapper = document.createElement("div");
            wrapper.className = "score-row";
            wrapper.innerHTML = `
                <span class="score-label">${candidateId}</span>
                <div class="score-track"><div class="score-fill"></div></div>
                <span class="score-value">0</span>
            `;
            document.getElementById("score-bars").appendChild(wrapper);
            scoreBars[candidateId] = wrapper;
            return wrapper;
        }

        function levelColor(level) {
            if (level === "red") return "#e5484d";
            if (level === "yellow") return "#e5c73d";
            return "#3d3f45";
        }

        // Glance bar counts are derived from each candidate's CURRENT level
        // (the level of their most recent alert, tagged on the score fill
        // element) — not a running total of alerts ever fired, since a
        // candidate who alerted red once but has since calmed down
        // shouldn't still count as "currently red". This has the same
        // known limitation as the score bars themselves: it only updates
        // on new alerts, so it won't reflect alert_manager's server-side
        // score decay between alerts.
        function updateGlanceBar() {
            const fills = document.querySelectorAll("#score-bars .score-fill");
            let red = 0, yellow = 0;
            fills.forEach(f => {
                if (f.dataset.level === "red") red++;
                else if (f.dataset.level === "yellow") yellow++;
            });
            document.getElementById("glance-red").textContent = red;
            document.getElementById("glance-yellow").textContent = yellow;
            document.getElementById("glance-total").textContent = fills.length;
        }

        // A single AudioContext, created once, reused for every beep.
        // Browsers block audio output until the user has interacted with
        // the page at least once (click/keypress) — creating a NEW context
        // per alert (as before) meant the very first alert almost always
        // arrived before that interaction happened. Reusing one context and
        // explicitly resuming it on first interaction fixes that.
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            return audioCtx;
        }
        ["click", "keydown"].forEach(evt => {
            document.addEventListener(evt, () => {
                const ctx = getAudioContext();
                if (ctx.state === "suspended") ctx.resume();
            }, { once: true });
        });

        function playAlertBeep() {
            try {
                const ctx = getAudioContext();
                const oscillator = ctx.createOscillator();
                const gain = ctx.createGain();
                oscillator.type = "square";
                oscillator.frequency.value = 880;
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
                oscillator.connect(gain);
                gain.connect(ctx.destination);
                oscillator.start();
                oscillator.stop(ctx.currentTime + 0.4);
            } catch (e) {
                // Still blocked (no interaction yet) — visual modal still
                // shows regardless, so the alert isn't silently lost.
            }
        }

        function showRedAlertModal(data) {
            document.getElementById("modal-candidate").textContent = data.candidate_id;
            document.getElementById("modal-detail").textContent =
                `${data.behaviour} — score ${data.score} — ${data.timestamp}`;
            document.getElementById("alert-modal").classList.remove("hidden");
            playAlertBeep();
        }

        // Tracks which candidates have already received a yellow toast so
        // we don't spam one every ~15s (yellow's cooldown) while they stay
        // in the yellow zone. Cleared for a candidate the moment they cross
        // into red, so a fresh escalation is never suppressed.
        const yellowNotified = new Set();

        function showYellowToast(data) {
            const container = document.getElementById("toast-container");
            const toast = document.createElement("div");
            toast.className = "toast";
            toast.innerHTML = `
                <div class="toast-title">🟡 YELLOW ALERT</div>
                <div class="toast-body">${data.candidate_id} — ${data.behaviour} (score ${data.score})</div>
            `;
            container.appendChild(toast);

            // Auto-dismiss after 5s, non-blocking the whole time — this is
            // the "email notification on your phone" style, not a modal
            // that interrupts the invigilator's screen.
            setTimeout(() => {
                toast.classList.add("toast-out");
                setTimeout(() => toast.remove(), 250);
            }, 5000);
        }

        document.getElementById("modal-dismiss").addEventListener("click", () => {
            document.getElementById("alert-modal").classList.add("hidden");
        });

        function showSnapshot(data) {
            document.getElementById("snapshot-caption").textContent =
                `${data.candidate_id} — ${data.behaviour} — score ${data.score} — ${data.timestamp}`;
            document.getElementById("snapshot-img").src = `/snapshots/${data.snapshot}`;
            document.getElementById("snapshot-modal").classList.remove("hidden");
        }

        document.getElementById("snapshot-dismiss").addEventListener("click", () => {
            document.getElementById("snapshot-modal").classList.add("hidden");
        });

        // Renders a single alert event into the log, score bar, and seat
        // map. Used for BOTH the live SSE stream and the /history replay
        // on page load, so the two never fall out of sync with each other.
        function renderAlertEvent(data, { isLive } = { isLive: true }) {
            const tbody = document.querySelector("#alert-log tbody");
            const row = document.createElement("tr");
            row.innerHTML = `
                <td>${data.timestamp}</td>
                <td>${data.candidate_id}</td>
                <td>${data.behaviour}</td>
                <td>${data.score}</td>
                <td>${data.camera_id}</td>
                <td>${data.snapshot ? '<span class="snapshot-badge">📷</span>' : ''}</td>
            `;
            if (data.snapshot) {
                row.classList.add("has-snapshot");
                row.addEventListener("click", () => showSnapshot(data));
            }
            tbody.prepend(row);

            const bar = ensureScoreBar(data.candidate_id);
            const fill = bar.querySelector(".score-fill");
            const value = bar.querySelector(".score-value");
            fill.style.width = Math.min(data.score, 100) + "%";
            fill.style.background = levelColor(data.level);
            fill.dataset.level = data.level;
            value.textContent = data.score;
            updateGlanceBar();

            const seatId = `seat-${data.candidate_id}`;
            const seat = document.getElementById(seatId);
            if (seat) {
                seat.style.background = levelColor(data.level);
                if (isLive) {
                    seat.classList.add("flash");
                    setTimeout(() => seat.classList.remove("flash"), 1500);
                }
            }

            // Red alerts: interrupting modal + beep, every time (subject to
            // the backend's own 30s cooldown). Yellow alerts: a single,
            // non-blocking toast per candidate — suppressed on repeats
            // until that candidate escalates to red, at which point the
            // suppression resets so a future yellow episode notifies again.
            // Neither fires when replaying /history on page load.
            if (isLive) {
                if (data.level === "red") {
                    yellowNotified.delete(data.candidate_id);
                    showRedAlertModal(data);
                } else if (data.level === "yellow") {
                    if (!yellowNotified.has(data.candidate_id)) {
                        yellowNotified.add(data.candidate_id);
                        showYellowToast(data);
                    }
                }
            }
        }

        // Inserts a labeled header row above whatever's currently at the
        // top of the alert log table — used to mark where one testing
        // session's alerts end and an earlier one begins, since /history
        // can span many separate runs of app_real.py across different
        // times/days with nothing else distinguishing them.
        function insertSessionDivider(label) {
            const tbody = document.querySelector("#alert-log tbody");
            const divider = document.createElement("tr");
            divider.className = "session-divider";
            divider.innerHTML = `<td colspan="6">${label}</td>`;
            tbody.prepend(divider);
        }

        // 1. Load history first so the log isn't empty after a refresh
        fetch("/history")
            .then(r => r.json())
            .then(events => {
                // Events arrive oldest-first. Render each (which prepends
                // it, so newest ends up on top overall), and whenever a
                // NEW session starts, close out the PREVIOUS session's
                // block with a divider first — that divider gets prepended
                // after all of that session's rows, landing correctly at
                // the top of that now-complete block. The final (most
                // recent) session's divider is flushed after the loop.
                let currentSessionLabel = null;
                events.forEach(e => {
                    if (e.new_session) {
                        if (currentSessionLabel !== null) {
                            insertSessionDivider(currentSessionLabel);
                        }
                        currentSessionLabel = e.session_label;
                    }
                    renderAlertEvent(e, { isLive: false });
                });
                if (currentSessionLabel !== null) {
                    insertSessionDivider(currentSessionLabel);
                }
            })
            .catch(err => console.error("Failed to load alert history:", err));

        // 2. Then attach to the live stream for anything new
        const source = new EventSource("/alerts");
        source.onmessage = function (e) {
            const data = JSON.parse(e.data);
            renderAlertEvent(data, { isLive: true });
        };
    </script>
</body>
</html>
