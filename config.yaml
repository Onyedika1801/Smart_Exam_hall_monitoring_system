# ============================================================
# Smart Exam Hall Monitoring System — Configuration File
# Chapter 3 Reference: Section 3.16
# ALL thresholds and settings live here — never hardcode in modules
# ============================================================

# --- Camera Settings ---
camera:
  device_index: 0          # 0 = first USB camera. Change to 1, 2 etc for other cameras
  width: 1920               # Upgraded from the original 640x480 dev webcam,
  height: 1080              # which was hardware-limited regardless of the
                             # requested resolution (confirmed via direct
                             # probing, Section 4.7). If main.py logs a lower
                             # actual resolution than requested, check
                             # cv2.CAP_PROP_FRAME_WIDTH/HEIGHT after opening
                             # to see what the camera actually granted.
  fps: 30
  input_type: "live"       # "live" for webcam, "video" for test file
  test_video_path: "test_videos/test.mp4"  # used only when input_type = "video"

# --- Frame Queue Settings (Section 3.13) ---
# Each module has its own queue — separate, not shared
queues:
  max_size: 30             # Max frames in each module queue before dropping oldest
  # If queue hits max_size, oldest frame is dropped to keep system real-time

# --- Phone Detection Module (Section 3.7) ---
phone_detection:
  model_path: "models/phone_detector_best.pt"
  confidence_threshold: 0.55     # Min confidence to consider a detection
  inference_image_size: 640     # Native training resolution. Was reduced to
                                  # 320 to cope with CPU-only inference
                                  # (Section 4.3.1) — the smaller size was a
                                  # known contributor to weaker detection of
                                  # small/distant phones. Re-tune downward
                                  # again if throughput under full
                                  # four-module load doesn't support full
                                  # resolution in practice.
  frame_skip: 3                  # Tuned from measured queue saturation: a
                                  # full 10-min four-module session showed
                                  # this module's queue stuck at 30/30 the
                                  # entire run, with actual throughput of
                                  # only ~0.5-0.6 fps against a ~25-30 fps
                                  # camera — frames were already being
                                  # silently dropped via queue overflow, just
                                  # unpredictably rather than deliberately.
                                  # Re-check get_stats()['queue_size'] on the
                                  # next real test; raise further if it's
                                  # still pinned at max.
  base_score: 35                 # Chapter 3 Table 3.5 — unambiguous violation

  # Confidence weighting (Chapter 3 Table 3.7)
  confidence_weights:
    tier_1_threshold: 0.90       # >= 0.90 → 100% of base score
    tier_2_threshold: 0.75       # >= 0.75 → 80% of base score
    tier_3_threshold: 0.60       # >= 0.60 → 60% of base score
    # Below confidence_threshold (0.55) → ignored entirely

  # Phone detection = immediate alert, NO persistence counter (Section 3.7.3)
  requires_persistence: false

  # High-confidence auto-alert override (applied in alert_manager.py, not
  # here — this module has no scoring logic, per Section 3.10). A single
  # phone detection at or above this confidence is treated as strong
  # enough evidence on its own to force an immediate red alert for that
  # candidate, rather than requiring repeated detections or a
  # corroborating signal from another module.
  high_confidence_auto_alert_threshold: 0.70

  # Throttles repeat events for the SAME candidate remaining visible
  # across many consecutive processed frames. Without this, a
  # continuously held phone generated a fresh, fully-scored event on
  # every processed frame (confirmed via live testing: candidate score
  # reaching 1600+ within seconds). Mirrors gaze_detection's 5s and
  # posture_analysis's 8s repeat-alert cooldowns. Does NOT delay the
  # first alert for a newly detected phone.
  re_alert_cooldown_seconds: 5.0

# --- Gaze / Head Detection Module (Section 3.6) ---
gaze_detection:
  # Head orientation thresholds (Chapter 3 Table 3.3, updated post-deployment)
  yaw_threshold: 30.0            # degrees left/right before flagging — the
                                  # ONLY orientation this module scores on.
  persistence_seconds: 3.0       # sustained seconds before raising event
  base_score_sustained: 15       # Chapter 3 Table 3.5
  base_score_brief: 8

  # --- Pitch (up/down) — NOT used for scoring ---
  # Pitch detection was removed from _classify_deviation() after real
  # exam-hall use showed it couldn't distinguish suspicious behaviour from
  # normal writing posture (see modules/gaze_detection.py docstring for the
  # full rationale). The values below are loaded but have no effect on
  # alerts — kept only because the pitch estimator itself still runs for
  # draw_detections()'s on-screen debug display. Safe to ignore; remove
  # once the debug display no longer needs them.
  pitch_down_threshold: -20.0
  pitch_up_threshold: 15.0
  pitch_calibration_window_seconds: 130
  pitch_down_margin: 15.0

# --- Posture Analysis Module (Section 3.9) ---
posture_analysis:
  calibration_window_seconds: 60  # First 60s = baseline recording
  deviation_std_multiplier: 2.0   # Flag if > 2 std devs from personal baseline
  persistence_seconds: 3.0
  base_score_sustained: 10        # Chapter 3 Table 3.5
  base_score_brief: 5
  frame_skip: 2                   # Process 1 in every N frames. Added after
                                   # live integrated testing showed this
                                   # module capped near 4 fps under full
                                   # four-module CPU load. Lower than phone's
                                   # skip since MediaPipe Pose is already
                                   # noticeably cheaper per-frame than YOLO.

# --- Object Passing Module (Section 3.8) ---
# See modules/object_passing.py docstring for full design rationale and
# documented limitations (Option B below).
object_passing:
  model_path: "models/phone_detector_best.pt"   # TEMP: reuse existing weights
                                                   # until a dedicated
                                                   # paper/pen dataset is
                                                   # trained (see limitations)
  object_confidence_threshold: 0.35

  # --- Generic object detector (supplements the phone-only fine-tuned
  # model above) ---
  # model_path is fine-tuned ONLY on phones, so it essentially never
  # recognises a held paper/booklet/pen as an object -- meaning a real
  # hand-crossing WITH a passed item was being detected as "empty hand"
  # and silently discarded (holding_object=False), even though the
  # crossing itself was tracked correctly. This is a stopgap, NOT a
  # substitute for a proper paper/pen dataset: COCO has no "paper" or
  # "exam booklet" class, so "book" is used as the closest proxy and
  # will still miss loose sheets, though it should catch folded/bound
  # booklets, and cell phone/remote/scissors as a bonus safety net for
  # small rigid items generally. Uses YOLOv8n's stock COCO-pretrained
  # weights (auto-downloaded by ultralytics on first run if not cached
  # locally) -- NOT the fine-tuned phone weights.
  use_generic_object_detector: true
  generic_model_path: "models/yolov8n.pt"
  generic_object_confidence_threshold: 0.33  # Raised from 0.3: debug-log
                                               # evidence (empty-hand test
                                               # session) showed 'knife' and
                                               # 'backpack' repeatedly
                                               # scoring 0.30-0.44, meaning
                                               # 0.3 sat inside this model's
                                               # noise floor under this
                                               # setup's lighting. NOT yet
                                               # validated against a real
                                               # held book/phone — that test
                                               # only characterised the
                                               # noise floor, not where a
                                               # real target object's
                                               # confidence lands. Retest
                                               # with an actual held object
                                               # before trusting this value.
  generic_object_classes: ["book", "cell phone", "remote", "scissors"]

  frame_skip: 5                   # Tuned from measured queue saturation.
                                   # This module runs TWO YOLO models per
                                   # processed frame (fine-tuned + generic
                                   # COCO) plus MediaPipe Hands, making it
                                   # the heaviest of the four. A 10-min
                                   # four-module session showed its queue
                                   # stuck at 30/30 the entire run, actual
                                   # throughput only ~0.36-0.53 fps against
                                   # a ~25-30 fps camera. 5 is a reasoned
                                   # starting point from that ratio, not
                                   # yet re-benchmarked — re-check
                                   # get_stats() on the next real test.
  zone_padding_pixels: 80         # Pixels beyond body keypoints = personal zone
  transfer_time_window_seconds: 1.5
  min_zone_separation: 0.15       # Min fraction of frame width between zones
  base_score: 30                  # Chapter 3 Table 3.5

  # --- Hand-crossing detection (Option A) ---
  # Rather than relying purely on per-zone object counts (which cannot
  # detect a simultaneous swap — see limitations), track hand/wrist
  # position via MediaPipe Hands and flag when a hand crosses the shared
  # boundary between two adjacent candidate zones while holding an
  # object-like shape near the wrist.
  hand_detection_confidence: 0.5
  hand_tracking_confidence: 0.5
  boundary_margin_pixels: 40      # Width of the "shared edge" strip between
                                   # adjacent zones that counts as a crossing
  object_proximity_pixels: 60     # Max distance between wrist and a detected
                                   # object box to count as "holding" it
  max_hand_movement_pixels: 180   # Max distance a hand can move between
                                   # two PROCESSED (non-skipped) frames and
                                   # still be considered "the same hand" for
                                   # crossing detection. Needs to be larger
                                   # than a bucket/tile size specifically
                                   # BECAUSE of frame_skip — with 5/6 frames
                                   # skipped, real hand movement between
                                   # sampled frames is larger than it would
                                   # be frame-to-frame at full rate.

  # --- Attendance / mass-distribution burst detection (pattern 2) ---
  # Attendance sheets, question papers, etc. are typically passed down a
  # row in a short, synchronised burst at a known point in the exam
  # (start, or a collection midway). This produces MANY simultaneous
  # cross-zone hand movements across different candidate pairs within a
  # few seconds — a distinct signature from an isolated, later, one-off
  # transfer between two candidates, which is far more likely to be
  # exam malpractice.
  burst_detection_window_seconds: 8     # Look-back window for counting
                                          # concurrent crossings
  burst_min_concurrent_crossings: 3     # >= this many crossings across
                                          # DIFFERENT zone-pairs within the
                                          # window = treat as mass
                                          # distribution, suppress scoring
  # Simple fallback grace window (used alongside burst detection, not
  # instead of it) — covers the very start of the exam when attendance
  # is most predictably passed, even if burst detection's threshold
  # isn't met for some reason (e.g. slow/staggered passing).
  grace_window_seconds: 130             # First ~2.2 minutes: crossings are
                                          # logged but not scored. Set to
                                          # match gaze_detection's
                                          # pitch_calibration_window_seconds
                                          # (130s) so both windows end at
                                          # the same time, on request.
                                          # Coincidence of value, not a
                                          # shared config variable -- if
                                          # one changes later, update the
                                          # other manually to keep them
                                          # aligned.

# --- Scoring & Alert System (Section 3.10) ---
scoring:
  # Duration multipliers (Chapter 3 Table 3.6)
  duration_multipliers:
    under_3s: 1.0
    from_3_to_6s: 1.5
    from_6_to_10s: 2.0
    over_10s: 3.0

  # Combination bonus (Section 3.10.4)
  combination_bonus: 1.20         # 20% bonus if 2+ modules flag same candidate
  combination_window_seconds: 30  # Window to check for corroborating signals

  # Score window (Section 3.10.4)
  score_window_seconds: 120       # Events older than 120s no longer contribute

  # Score decay (Section 3.10.5)
  decay_percent_per_10s: 10       # -10% every 10s of clean behaviour

  # Alert thresholds (Chapter 3 Table 3.8)
  yellow_threshold: 60
  red_threshold: 75
  max_score: 200

# --- Alert Cooldowns (Section 3.11) ---
alerts:
  red_cooldown_seconds: 30        # No repeat red alert for same candidate for 30s
  yellow_cooldown_seconds: 15

# --- Database (Section 3.11) ---
database:
  path: "database/incidents.db"

# --- Dashboard (Section 3.12) ---
dashboard:
  host: "0.0.0.0"
  port: 5000
  audio_alert: true

# --- Preprocessing (Section 3.5) ---
preprocessing:
  gaussian_blur_kernel: 3         # Must be odd number
  brightness_threshold: 80        # If avg pixel < this, boost brightness
